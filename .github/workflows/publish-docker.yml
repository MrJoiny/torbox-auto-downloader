name: publish-docker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          namespace = {}
          exec(Path("version.py").read_text(encoding="utf-8"), namespace)

          version = namespace["__version__"]
          major, minor, _patch = version.split(".")
          image_repo = "mrjoiny/torbox-auto-downloader"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              print(f"version={version}", file=fh)
              print(f"major_minor={major}.{minor}", file=fh)
              print(f"major={major}", file=fh)
              print(f"image_repo={image_repo}", file=fh)
          PY

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.major_minor }}
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.major }}
            ${{ steps.meta.outputs.image_repo }}:latest

      - name: Publish summary
        run: |
          echo "Published:"
          echo "  ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}"
          echo "  ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.major_minor }}"
          echo "  ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.major }}"
          echo "  ${{ steps.meta.outputs.image_repo }}:latest"
