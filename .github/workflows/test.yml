name: test-suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80

  docker-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read app version
        id: version
        run: echo "app_version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=${{ steps.version.outputs.app_version }} -t torbox-auto-downloader:test .
